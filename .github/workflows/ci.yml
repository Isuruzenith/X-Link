name: Continuous Integration

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'index.html'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - 'eslint.config.*'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'index.html'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - 'eslint.config.*'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Lint & Format Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            pkg-config libssl-dev \
            libglib2.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Export pkg-config path
        run: |
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig" >> $GITHUB_ENV
          pkg-config --modversion glib-2.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Frontend Linting
        run: npm run lint

      - name: Frontend Type Check
        run: npm run build

      - name: Frontend Tests
        run: npm test

      - name: Rust Toolchain Setup
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache-workspaces: './src-tauri -> target'

      - name: Rust Formatting Check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Setup Sidecars
        run: node scripts/setup-sidecars.cjs

      - name: Rust Clippy Lints
        env:
          PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  test-and-check-matrix:
    name: Check & Test
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            pkg-config libssl-dev \
            libglib2.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Export pkg-config path (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig" >> $GITHUB_ENV
          pkg-config --modversion glib-2.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache-workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Setup Sidecars
        run: node scripts/setup-sidecars.cjs

      - name: Cargo Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Cargo Test
        run: cargo test --manifest-path src-tauri/Cargo.toml
